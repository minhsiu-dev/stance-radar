# Opt-in override for disk-constrained environments (e.g. a CI sandbox): uses
# frontend/Dockerfile.e2e to package the host-built .next/standalone, avoiding the ~1GB in-container npm ci.
#
# Usage (pass this extra -f on top of the default e2e flow, and build the frontend on the host first):
#   cd frontend && API_URL=http://api:8000 npm run build && cd ..
#   docker compose -p stance-e2e \
#     -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.e2e.lowdisk.yml \
#     up -d --build
#
# Note: next rewrites()'s API_URL is baked into the standalone at `next build` time,
# so the host build MUST pass API_URL=http://api:8000, otherwise it falls back to
# localhost:8000 and the container can't reach api (runtime env doesn't re-apply to a standalone build).
services:
  frontend:
    build:
      dockerfile: Dockerfile.e2e
