services:
  # Every service carries `restart: unless-stopped` so the stack comes back by itself when
  # the Docker daemon restarts (in the dev sandbox the daemon shares its lifetime with the
  # workspace container, so "container restarted" == "daemon restarted"). Caveat: the daemon
  # does *not* honour depends_on when it restores containers on boot, so api/worker may exit
  # and be restarted a few times until db is accepting connections. That converges on its own
  # -- it is the same self-healing path worker already relied on, not a failure.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stance
      POSTGRES_PASSWORD: stance
      POSTGRES_DB: stance_radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stance -d stance_radar"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://stance:stance@db:5432/stance_radar
      USE_FAKE_ADAPTERS: ${USE_FAKE_ADAPTERS:-false}
    ports:
      - "8000:8000"
    healthcheck:
      # Only reports healthy once the lifespan (create_all + run_startup_migrations) has
      # finished -- ASGI servers hold off accepting connections until lifespan.startup
      # completes, so a 200 here is also the worker's "schema exists" signal below.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.worker
    # The whole point of the split: if this process ever degrades to where it can't spawn
    # children, it exits and Docker hands us a clean one.
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://stance:stance@db:5432/stance_radar
      USE_FAKE_ADAPTERS: ${USE_FAKE_ADAPTERS:-false}
      API_BASE_URL: http://api:8000
    volumes:
      # Read-only mount of the host's Claude Code credentials so 'claude -p' analysis works
      - ${HOME}/.claude:/root/.claude:ro
    depends_on:
      db:
        condition: service_healthy
      api:
        # Not service_started: that only waits for the api container to start, not for its
        # lifespan (create_all + run_startup_migrations) to finish. On a cold stack the
        # worker's first fail_orphan_jobs would hit an undefined `jobs` table otherwise.
        # api's healthcheck above only turns healthy once lifespan.startup has completed,
        # so this is the actual "schema exists" gate.
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
