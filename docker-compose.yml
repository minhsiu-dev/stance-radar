services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stance
      POSTGRES_PASSWORD: stance
      POSTGRES_DB: stance_radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stance -d stance_radar"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://stance:stance@db:5432/stance_radar
      USE_FAKE_ADAPTERS: ${USE_FAKE_ADAPTERS:-false}
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.claude:/root/.claude:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
